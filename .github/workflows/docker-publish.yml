name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build metadata
        id: bm
        run: |
          echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ steps.bm.outputs.sha }}
            BUILD_TIME=${{ steps.bm.outputs.time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      # Telling the home server to pull now. The image is already in the
      # registry by this point, and Watchtower polls on its own schedule, so a
      # notification that does not get through delays the update — it does not
      # lose it. Failing the whole run for that turns every unreachable-server
      # moment into a red build, and a red build that is usually nothing is a
      # red build nobody reads. Capped rather than left to hang: the failure
      # that prompted this was a 524 after two minutes of waiting.
      - name: Trigger Watchtower Update
        uses: darnfish/watchtower-update@v3.3
        continue-on-error: true
        timeout-minutes: 2
        with:
          url: "${{ secrets.WATCHTOWER_URL }}"
          api_token: "${{ secrets.WATCHTOWER_API_TOKEN }}"
          # 在這裡指定你的 Docker Image 名稱與標籤
          images: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
